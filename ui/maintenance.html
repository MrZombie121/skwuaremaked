<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYWATCH — ТЕХНІЧНІ РОБОТИ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05080c;
            --border-color: #1a2738;
            --text-main: #c3ced9;
            --text-bright: #f0f6fc;
            --color-orange: #ff9100;
            --color-cyan: #00e5ff;
            --color-red: #ff2a4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 145, 0, 0.04) 0%, transparent 60%),
                linear-gradient(rgba(26, 39, 56, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26, 39, 56, 0.2) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .maint-card {
            background: rgba(10, 15, 22, 0.95);
            border: 2px solid var(--border-color);
            border-top: 4px solid var(--color-orange);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 145, 0, 0.15);
            border-radius: 6px;
            max-width: 650px;
            width: 100%;
            padding: 36px 32px;
            text-align: center;
            position: relative;
        }

        .pulse-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 145, 0, 0.15);
            border: 2px solid var(--color-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px auto;
            box-shadow: 0 0 20px rgba(255, 145, 0, 0.3);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); box-shadow: 0 0 10px rgba(255, 145, 0, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 145, 0, 0.6); }
            100% { transform: scale(0.95); box-shadow: 0 0 10px rgba(255, 145, 0, 0.3); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--text-bright);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .badge-tag {
            font-size: 10px;
            background: rgba(255, 145, 0, 0.2);
            color: var(--color-orange);
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid var(--color-orange);
            display: inline-block;
            margin-bottom: 16px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .reason-text {
            font-size: 13.5px;
            line-height: 1.6;
            color: #f0f6fc;
            margin-bottom: 20px;
            white-space: pre-wrap;
            background: rgba(16, 23, 34, 0.6);
            padding: 14px 18px;
            border-radius: 4px;
            border: 1px dashed var(--border-color);
        }

        /* Countdown Timer Box */
        .timer-container {
            background: #06090e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timer-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--color-cyan);
            letter-spacing: 1px;
        }

        .timer-display {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .time-block {
            background: #101722;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            min-width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--color-orange);
        }

        .time-unit {
            font-size: 8.5px;
            color: #6b7a8d;
            font-weight: 700;
        }

        .status-box {
            background: #06090e;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11.5px;
            color: var(--color-cyan);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .retry-btn {
            background: transparent;
            border: 1px solid var(--color-cyan);
            color: var(--color-cyan);
            padding: 9px 22px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retry-btn:hover {
            background: var(--color-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="maint-card">
        <div class="pulse-icon">🛠️</div>
        <h1>SKYWATCH RADAR</h1>
        <div class="badge-tag">РЕЖИМ ТЕХНІЧНОГО ОБСЛУГОВУВАННЯ</div>
        
        <div class="reason-text" id="maint-reason">Тривають планові технічні роботи. Моніторинг скоро відновиться.</div>
        
        <!-- Live Countdown Timer to End Time -->
        <div class="timer-container" id="timer-box" style="display: none;">
            <div class="timer-label">⏳ ДО ЗАВЕРШЕННЯ ТЕХНІЧНИХ РОБІТ:</div>
            <div class="timer-display">
                <div class="time-block">
                    <span class="time-val" id="cnt-days">00</span>
                    <span class="time-unit">ДНІВ</span>
                </div>
                <div class="time-block">
                    <span class="time-val" id="cnt-hours">00</span>
                    <span class="time-unit">ГОД</span>
                </div>
                <div class="time-block">
                    <span class="time-val" id="cnt-mins">00</span>
                    <span class="time-unit">ХВ</span>
                </div>
                <div class="time-block">
                    <span class="time-val" id="cnt-secs">00</span>
                    <span class="time-unit">СЕК</span>
                </div>
            </div>
        </div>

        <div class="status-box">
            <span>СИСТЕМА: TURSO CLOUD</span>
            <span>СТАТУС: ТЕХ РОБОТИ</span>
            <span id="auto-check-timer">ПЕРЕВІРКА: 10с</span>
        </div>

        <button class="retry-btn" onclick="window.location.reload()">🔄 ПЕРЕВІРИТИ ДОСТУПНІСТЬ</button>
    </div>

    <script>
        let endTimestamp = 0;

        async function fetchMaintenanceStatus() {
            try {
                const resp = await fetch('/api/maintenance/status');
                const data = await resp.json();
                
                if (!data.maintenance_mode) {
                    window.location.reload();
                    return;
                }

                if (data.reason) {
                    document.getElementById('maint-reason').innerText = data.reason;
                }

                if (data.end_timestamp && data.end_timestamp > 0) {
                    endTimestamp = data.end_timestamp;
                    document.getElementById('timer-box').style.display = 'flex';
                } else {
                    document.getElementById('timer-box').style.display = 'none';
                }
            } catch (e) {
                console.error("Status check error:", e);
            }
        }

        function updateCountdown() {
            if (endTimestamp <= 0) return;
            const now = Math.floor(Date.now() / 1000);
            let diff = endTimestamp - now;

            if (diff <= 0) {
                document.getElementById('cnt-days').innerText = "00";
                document.getElementById('cnt-hours').innerText = "00";
                document.getElementById('cnt-mins').innerText = "00";
                document.getElementById('cnt-secs').innerText = "00";
                return;
            }

            const days = Math.floor(diff / (24 * 3600));
            diff %= (24 * 3600);
            const hours = Math.floor(diff / 3600);
            diff %= 3600;
            const mins = Math.floor(diff / 60);
            const secs = diff % 60;

            document.getElementById('cnt-days').innerText = String(days).padStart(2, '0');
            document.getElementById('cnt-hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('cnt-mins').innerText = String(mins).padStart(2, '0');
            document.getElementById('cnt-secs').innerText = String(secs).padStart(2, '0');
        }

        let checkSeconds = 10;
        setInterval(() => {
            checkSeconds--;
            document.getElementById('auto-check-timer').innerText = `ПЕРЕВІРКА: ${checkSeconds}с`;
            if (checkSeconds <= 0) {
                checkSeconds = 10;
                fetchMaintenanceStatus();
            }
        }, 1000);

        setInterval(updateCountdown, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            fetchMaintenanceStatus();
        });
    </script>
</body>
</html>
