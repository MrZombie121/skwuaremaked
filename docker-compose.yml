version: '3.8'

services:
  skywatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skywatch_radar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - TG_API_ID=${TG_API_ID:-32502863}
      - TG_API_HASH=${TG_API_HASH:-8b337b539d0bbe39e0d87c5d1f782f4f}
      - TG_SESSION_STRING=${TG_SESSION_STRING:-}
      - FOLDER_URL=${FOLDER_URL:-https://t.me/addlist/syGYtBj5T9AxNzIy}
    volumes:
      # Persistent storage for channels.json, settings.json, targets.json
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
